    outline:2px solid var(--bone);outline-offset:2px;border-radius:6px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ink-900);color:var(--bone);}
  body{
    min-height:100vh;
    font-family:Archivo,-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;
    font-weight:500;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  }
  #app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 18px 44px;}
  .hidden{display:none !important;}
  button,input{font-family:inherit;font-variant-numeric:inherit;}

  /* ---------- 筹码 ---------- */
  .chip{
    position:relative;border-radius:50%;flex:none;display:grid;place-items:center;
    background:repeating-conic-gradient(from 22deg,
      var(--c) 0 33deg, var(--spot, rgba(255,255,255,.82)) 33deg 45deg);
    box-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.3);
  }
  .chip::before{content:"";position:absolute;inset:19%;border-radius:50%;
    background:var(--ink-800);box-shadow:inset 0 0 0 1px var(--cd);}
  .chip i{position:relative;font-style:normal;color:var(--c);line-height:1;font-weight:800;}

  /* ---------- 查询页 ---------- */
  #lookup-view{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 0;}
  .brand{text-align:center;margin-bottom:32px;}
  .brand .mark{
    width:66px;height:66px;margin:0 auto 20px;border-radius:50%;position:relative;
    display:grid;place-items:center;
    background:repeating-conic-gradient(from 22deg,#e8b544 0 33deg, rgba(255,255,255,.82) 33deg 45deg);
    box-shadow:0 3px 10px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.3);
  }
  .brand .mark::before{content:"";position:absolute;inset:19%;border-radius:50%;
    background:var(--ink-800);box-shadow:inset 0 0 0 1px #6b4f12;}
  .brand .mark span{position:relative;font-size:21px;font-weight:800;color:#e8b544;}
  .brand h1{font-size:21px;margin:0 0 8px;font-weight:800;letter-spacing:.02em;}
  .brand p{font-size:13px;color:var(--bone-faint);margin:0;line-height:1.75;}

  .card{background:var(--ink-800);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--bone-faint);margin-bottom:9px;}
  .field input{
    width:100%;background:var(--ink-700);border:1px solid var(--line);color:var(--bone);
    border-radius:var(--r-sm);padding:14px 15px;font-size:22px;font-weight:800;
    letter-spacing:.22em;text-align:center;outline:none;transition:border-color .15s;
  }
  .field input::placeholder{font-size:15px;font-weight:500;letter-spacing:.06em;color:var(--bone-faint);}
  .field input:focus{border-color:var(--line-2);background:var(--ink-600);}

  .btn{
    border:none;border-radius:var(--r-sm);padding:15px 18px;width:100%;
    font-size:15.5px;font-weight:700;cursor:pointer;letter-spacing:.02em;
    background:var(--bone);color:#0d1117;transition:transform .08s,opacity .15s;
  }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.5;}
  .btn-quiet{background:transparent;border:1px solid var(--line-2);color:var(--bone-dim);font-weight:600;}
  .msg{font-size:13.5px;margin-top:14px;line-height:1.7;color:var(--down);}
  .msg.info{color:var(--bone-dim);}
  .spinner{
    width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:7px;
    border:2px solid rgba(13,17,23,.25);border-top-color:#0d1117;animation:spin .7s linear infinite;
  }
  .spinner.dark{border-color:rgba(233,237,243,.25);border-top-color:var(--bone);margin:0;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- 选择本人 ---------- */
  .pick-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--ink-800);border:1px solid var(--line);border-radius:var(--r);
    padding:17px 18px;margin-bottom:9px;cursor:pointer;color:var(--bone);text-align:left;
    transition:border-color .15s,transform .08s;
  }
  .pick-btn:active{transform:scale(.985);border-color:var(--line-2);}
  .pick-name{font-size:18px;font-weight:800;letter-spacing:.01em;}
  .pick-arrow{color:var(--bone-faint);font-size:17px;flex:none;}

  /* ---------- 会员卡 ---------- */
  #result-view{padding-top:24px;}
  .member-card{
    position:relative;overflow:hidden;
    background:var(--ink-800);border:1px solid var(--line-2);border-radius:var(--r-lg);
    padding:20px 22px;margin-bottom:10px;
  }
  /* 卡面暗纹：一枚压印的筹码轮廓 */
  .member-card::after{
    content:"";position:absolute;right:-34px;top:-34px;width:124px;height:124px;border-radius:50%;
    background:repeating-conic-gradient(from 22deg,
      rgba(233,237,243,.022) 0 33deg, rgba(233,237,243,0) 33deg 45deg);
    -webkit-mask-image:radial-gradient(circle at 70% 30%, #000 30%, transparent 72%);
    mask-image:radial-gradient(circle at 70% 30%, #000 30%, transparent 72%);
    pointer-events:none;
  }
  .member-name{font-size:26px;font-weight:800;letter-spacing:.01em;position:relative;}
  .member-phone{font-size:13px;color:var(--bone-dim);margin-top:7px;letter-spacing:.14em;position:relative;}
  .title-tag{
    font-size:11px;font-weight:600;color:var(--bone-faint);margin-left:9px;
    padding:3px 10px;border-radius:40px;background:var(--ink-700);
    border:1px solid var(--line);vertical-align:middle;letter-spacing:.04em;
  }

  .store-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    margin:26px 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line);
  }
  .store-head h2{font-size:14px;margin:0;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .store-head span{font-size:10.5px;color:var(--bone-faint);letter-spacing:.1em;text-transform:uppercase;}

  /* ---------- 筹码架 ---------- */
  .bal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .bal-cell{
    background:var(--ink-800);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 8px 13px;text-align:center;
  }
  .bal-cell .chip{width:46px;height:46px;margin:0 auto 11px;}
  .bal-cell .chip i{font-size:15px;}
  .bal-cell .num{font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.02em;display:block;}
  .bal-cell .num.zero{color:var(--bone-faint);}
  .bal-cell .num.neg{color:var(--down);}
  .bal-cell .lbl{font-size:10.5px;color:var(--bone-faint);margin-top:5px;letter-spacing:.04em;}
  /* 发牌入场：全页唯一动效 */
  @media (prefers-reduced-motion: no-preference){
    .member-card{animation:deal .42s cubic-bezier(.2,.9,.3,1) both;}
    .bal-cell{animation:deal .42s cubic-bezier(.2,.9,.3,1) both;}
    .bal-cell:nth-child(1){animation-delay:.04s} .bal-cell:nth-child(2){animation-delay:.09s}
    .bal-cell:nth-child(3){animation-delay:.14s} .bal-cell:nth-child(4){animation-delay:.19s}
    .bal-cell:nth-child(5){animation-delay:.24s} .bal-cell:nth-child(6){animation-delay:.29s}
  }
  @keyframes deal{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

  /* ---------- 变更记录 ---------- */
  .hist-title{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--bone-faint);margin:26px 0 4px;}
  .hist-row{
    position:relative;display:flex;align-items:center;gap:11px;
    padding:13px 2px 13px 15px;border-bottom:1px solid var(--line);
  }
  .hist-row:last-child{border-bottom:none;}
  .hist-row::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:7px;height:7px;border-radius:50%;background:var(--c,var(--line-2));
    box-shadow:0 0 0 2px var(--cd,transparent);}
  .hist-left{flex:1;min-width:0;}
  .hist-item{font-size:14.5px;font-weight:700;letter-spacing:.01em;}
  .hist-time{font-size:11.5px;color:var(--bone-faint);margin-top:3px;letter-spacing:.02em;}
  .hist-right{flex:none;text-align:right;white-space:nowrap;}
  .hist-chg{font-size:15px;font-weight:800;letter-spacing:-.02em;}
  .hist-chg.pos{color:var(--up);}
  .hist-chg.neg{color:var(--down);}
  .hist-after{
    display:inline-block;font-size:11.5px;color:var(--bone-dim);margin-left:9px;
    padding:2px 9px;border-radius:40px;background:var(--ink-700);
    border:1px solid var(--line);font-weight:600;
  }
  .hist-after.neg{color:var(--down);border-color:rgba(239,106,95,.4);}
  .hist-empty{font-size:12.5px;color:var(--bone-faint);padding:18px 0;text-align:center;}
  .more-btn{
    width:100%;margin-top:12px;background:var(--ink-800);border:1px solid var(--line);
    color:var(--bone-dim);border-radius:var(--r-sm);padding:12px;font-size:13px;
    cursor:pointer;font-weight:600;letter-spacing:.02em;
  }
  .more-btn:active{transform:scale(.99);}

  .foot{
    margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
    font-size:10.5px;color:var(--bone-faint);text-align:center;line-height:2;
    letter-spacing:.08em;
  }

</style>
</head>
<body>
<div id="app">

  <!-- ============ 查询 ============ -->
  <div id="lookup-view">
    <div class="brand">
      <div class="mark"><span>♠️</span></div>
      <h1>会员查询</h1>
      <p>输入手机号后四位<br>查看你在店里的门票、酒水卡与积分</p>
    </div>
    <div class="card">
      <div class="field">
        <label>手机号后四位</label>
        <input id="in-phone" inputmode="numeric" autocomplete="off"
               placeholder="例如：1234" maxlength="20">
      </div>
      <button class="btn" id="go-btn">查询</button>
      <div class="msg hidden" id="msg"></div>
    </div>
    <div class="foot">本页面只用作会员信息查询<br>如有疑问请联系店员</div>
  </div>

  <!-- ============ 选择本人 ============ -->
  <div id="choose-view" class="hidden">
    <div class="brand" style="margin-bottom:22px;">
      <div class="mark"><span>?</span></div>
      <h1>请选择你自己</h1>
      <p id="choose-sub"></p>
    </div>
    <div id="choose-list"></div>
    <button class="btn btn-quiet" id="choose-back" style="margin-top:18px;">返回重新输入</button>
    <div class="foot">没有你的名字？请联系店员核对登记信息</div>
  </div>

  <!-- ============ 结果 ============ -->
  <div id="result-view" class="hidden">
    <div class="member-card">
      <div class="member-name" id="r-name"></div>
      <div class="member-phone" id="r-phone"></div>
    </div>
    <div id="r-accounts"></div>
    <button class="btn btn-quiet" id="back-btn" style="margin-top:24px;">返回重新查询</button>
    <div class="foot">数据实时来自门店系统<br>如与实际不符请联系店员核对</div>
  </div>

</div>

<script>
/* ===== 与员工端同一个 Supabase 项目；此处的 anon key 是公开密钥，
        匿名访客对所有数据表没有任何读写权限，只能调用 customer_portal_lookup 这一个只读函数 ===== */
const SUPABASE_URL = "https://pkuojjqgwpgnjyvfptna.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrdW9qanFnd3Bnbmp5dmZwdG5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MDU5NDcsImV4cCI6MjEwMTE4MTk0N30.O8kWRZ1Uiy0PfG0tMmkpTJV1m458HH6TIvPspTH3GGI";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});

const ITEM_LABELS = {
  tickets:     { name: "SNG门票",  icon: "票" },
  mushroom:    { name: "复活蘑菇", icon: "菇" },
  wine_card:   { name: "酒卡",     icon: "酒" },
  drink_card:  { name: "饮料卡",   icon: "饮" },
  stored_value:{ name: "储值卡",   icon: "储", money: true },
  points:      { name: "积分",     icon: "分" },
};
const ITEM_FIELDS = Object.keys(ITEM_LABELS);
const PAGE = 15;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtVal = (f, v) => (ITEM_LABELS[f] && ITEM_LABELS[f].money ? "¥" : "") + v;

function fmtTime(iso){
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let lastDigits = "";

function showMsg(text, kind){
  const el = $("msg");
  el.className = "msg" + (kind === "info" ? " info" : "");
  el.innerHTML = text;
  el.classList.remove("hidden");
}
function clearMsg(){ $("msg").classList.add("hidden"); }

function toLookup(){
  $("result-view").classList.add("hidden");
  $("choose-view").classList.add("hidden");
  $("lookup-view").classList.remove("hidden");
  clearMsg();
  window.scrollTo(0, 0);
}

$("go-btn").addEventListener("click", ()=> lookup(null));
$("in-phone").addEventListener("keydown", e => { if (e.key === "Enter") lookup(null); });
$("back-btn").addEventListener("click", toLookup);
$("choose-back").addEventListener("click", toLookup);

async function lookup(pick){
  const btn = $("go-btn");

  if (pick === null){
    const phone = $("in-phone").value.replace(/\D/g, "");
    clearMsg();
    if (!(phone.length === 4 || phone.length >= 7)){
      showMsg("请输入手机号的后四位（也可以输入完整手机号）");
      return;
    }
    lastDigits = phone;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>查询中…';
  }

  const args = { p_phone: lastDigits };
  if (pick !== null) args.p_pick = pick;
  const { data, error } = await db.rpc("customer_portal_lookup", args);

  btn.disabled = false;
  btn.textContent = "查询";

  if (error){
    toLookup();
    showMsg("查询失败，请稍后再试");
    console.error(error);
    return;
  }

  switch (data && data.status){
    case "ok":
      render(data);
      return;
    case "choose":
      renderChoose(Array.isArray(data.options) ? data.options : []);
      return;
    case "rate_limited":
      toLookup();
      showMsg("查询过于频繁，请十分钟后再试。");
      return;
    case "not_found":
      toLookup();
      showMsg("没有找到对应的记录。请确认手机号是否与登记时一致，或联系店员。");
      return;
    default:
      toLookup();
      showMsg("查询失败，请稍后再试或联系店员。");
      return;
  }
}

function renderChoose(options){
  $("choose-sub").textContent = `有 ${options.length} 位客人的手机尾号都是 ${esc(lastDigits.slice(-4))}`;
  $("choose-list").innerHTML = options.map(o => `
    <button class="pick-btn" data-pick="${Number(o.pick)}">
      <span class="pick-name">${esc(o.name)}${
        o.title ? `<span class="title-tag">${esc(o.title)}</span>` : ""}</span>
      <span class="pick-arrow">›</span>
    </button>`).join("");

  $("choose-list").querySelectorAll("[data-pick]").forEach(b =>
    b.addEventListener("click", ()=>{
      $("choose-list").querySelectorAll("[data-pick]").forEach(x => x.disabled = true);
      b.querySelector(".pick-arrow").innerHTML = '<span class="spinner dark"></span>';
      lookup(Number(b.dataset.pick));
    }));

  $("lookup-view").classList.add("hidden");
  $("result-view").classList.add("hidden");
  $("choose-view").classList.remove("hidden");
  window.scrollTo(0, 0);
}

function render(data){
  $("r-name").innerHTML = esc(data.name)
    + (data.title ? `<span class="title-tag">${esc(data.title)}</span>` : "");
  $("r-phone").textContent = data.phone_masked || "";

  const accounts = Array.isArray(data.accounts) ? data.accounts : [];
  const multi = accounts.length > 1;

  $("r-accounts").innerHTML = accounts.map((acc, i) => {
    const bal = acc.balances || {};
    const hist = Array.isArray(acc.history) ? acc.history : [];
    return `
      <div class="store-head">
        <h2>${esc(acc.store)}</h2>
        <span>${multi ? "共 " + accounts.length + " 家门店" : "门店"}</span>
      </div>
      <div class="bal-grid">
        ${ITEM_FIELDS.map(f => {
          const v = bal[f] ?? 0;
          const cls = v < 0 ? "neg" : (v === 0 ? "zero" : "");
          return `<div class="bal-cell t-${f}">
            <span class="chip"><i>${ITEM_LABELS[f].icon}</i></span>
            <span class="num ${cls}">${esc(fmtVal(f, v))}</span>
            <div class="lbl">${ITEM_LABELS[f].name}</div>
          </div>`;
        }).join("")}
      </div>
      <div class="hist-title">变更记录${hist.length ? "（共 " + hist.length + " 条）" : ""}</div>
      <div id="hist-${i}"></div>`;
  }).join("");

  accounts.forEach((acc, i) => renderHistory(i, Array.isArray(acc.history) ? acc.history : [], PAGE));

  $("lookup-view").classList.add("hidden");
  $("choose-view").classList.add("hidden");
  $("result-view").classList.remove("hidden");
  window.scrollTo(0, 0);
}

function renderHistory(idx, hist, shown){
  const box = $("hist-" + idx);
  if (!box) return;
  if (!hist.length){
    box.innerHTML = `<div class="hist-empty">暂无记录</div>`;
    return;
  }
  const slice = hist.slice(0, shown);
  box.innerHTML = slice.map(h => {
    const f = h.item;
    const label = ITEM_LABELS[f] ? ITEM_LABELS[f].name : esc(f);
    const pos = h.change >= 0;
    const money = ITEM_LABELS[f] && ITEM_LABELS[f].money;
    const verb = money ? (pos ? "充值" : "消费") : (pos ? "增加" : "使用");
    const after = (h.after === null || h.after === undefined) ? "" :
      `<span class="hist-after${h.after < 0 ? " neg" : ""}">余 ${esc(fmtVal(f, h.after))}</span>`;
    return `<div class="hist-row t-${f}">
      <div class="hist-left">
        <div class="hist-item">${label} ${verb}</div>
        <div class="hist-time">${esc(fmtTime(h.at))}</div>
      </div>
      <div class="hist-right">
        <span class="hist-chg ${pos ? "pos" : "neg"}">${pos ? "+" : "-"}${esc(fmtVal(f, Math.abs(h.change)))}</span>
        ${after}
      </div>
    </div>`;
  }).join("");

  if (hist.length > shown){
    const btn = document.createElement("button");
    btn.className = "more-btn";
    btn.textContent = `显示更早的记录（还有 ${hist.length - shown} 条）`;
    btn.addEventListener("click", ()=> renderHistory(idx, hist, shown + PAGE));
    box.appendChild(btn);
  }
}
</script>
</body>
</html>
