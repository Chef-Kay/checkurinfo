<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14110d">
<title>会员查询</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#14110d; --surface:#1f1a14; --surface-2:#29221a; --surface-3:#332a1f;
    --border:#3a2f22; --text:#f2ece0; --text-dim:#b3a691; --text-faint:#7d7362;
    --amber:#c9862f; --amber-bright:#e2a44c; --amber-dim:#8a5f24;
    --green-bright:#93b884; --red-bright:#d97258;
    --radius:16px; --radius-sm:10px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(201,134,47,.10), transparent 45%),
      radial-gradient(circle at 90% 8%, rgba(201,134,47,.06), transparent 40%);
  }
  #app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 18px 40px;}
  .hidden{display:none !important;}

  /* ---------- 查询表单 ---------- */
  #lookup-view{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 0;}
  .brand{text-align:center;margin-bottom:30px;}
  .brand .mark{
    width:58px;height:58px;margin:0 auto 14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--surface-3), var(--surface));
    border:2px dashed var(--amber-dim);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:var(--amber-bright);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.45);
  }
  .brand h1{font-size:20px;margin:0 0 5px;letter-spacing:.04em;}
  .brand p{font-size:13px;color:var(--text-faint);margin:0;line-height:1.6;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-faint);margin-bottom:6px;letter-spacing:.03em;}
  .field input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius-sm);padding:12px 13px;font-size:16px;outline:none;
  }
  .field input:focus{border-color:var(--amber-dim);}
  .btn{
    border:none;border-radius:var(--radius-sm);padding:13px 18px;width:100%;
    font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg,var(--amber-bright),var(--amber));color:#1a1206;
    box-shadow:0 2px 8px rgba(201,134,47,.3);transition:transform .08s;
  }
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.55;}
  .btn-quiet{
    background:none;border:1px solid var(--border);color:var(--text-dim);box-shadow:none;
    font-weight:600;
  }
  .msg{font-size:13.5px;margin-top:12px;line-height:1.65;color:var(--red-bright);}
  .msg.info{color:var(--text-dim);}
  .spinner{
    width:15px;height:15px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:7px;
    border:2px solid rgba(0,0,0,.25);border-top-color:#1a1206;animation:spin .7s linear infinite;
  }
  .spinner.dark{border-color:rgba(226,164,76,.3);border-top-color:var(--amber-bright);margin:0;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- 会员卡 ---------- */
  #result-view{padding-top:22px;}
  .member-card{
    position:relative;overflow:hidden;
    background:linear-gradient(145deg, var(--surface-3), var(--surface));
    border:1px solid var(--amber-dim);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:8px;
  }
  .member-card::after{
    content:"";position:absolute;right:-32px;top:-32px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle, rgba(201,134,47,.16), transparent 70%);
  }
  .member-name{font-size:23px;font-weight:800;letter-spacing:.02em;}
  .member-name .title-tag{
    font-size:12px;font-weight:500;color:var(--text-faint);margin-left:8px;
    padding:2px 8px;border-radius:20px;background:var(--surface-2);
    border:1px solid var(--border);vertical-align:middle;
  }
  .member-phone{font-size:13px;color:var(--text-dim);margin-top:5px;letter-spacing:.08em;}

  .store-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:22px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--border);
  }
  .store-head h2{font-size:15px;margin:0;color:var(--amber-bright);letter-spacing:.03em;}
  .store-head span{font-size:11.5px;color:var(--text-faint);}

  .bal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .bal-cell{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:13px 8px;text-align:center;
  }
  .bal-cell .disc{
    width:30px;height:30px;margin:0 auto 7px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--surface-3), var(--surface-2));
    border:1px dashed var(--amber-dim);
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:800;color:var(--amber-bright);
  }
  .bal-cell .num{font-size:19px;font-weight:800;line-height:1.2;}
  .bal-cell .num.zero{color:var(--text-faint);}
  .bal-cell .num.neg{color:var(--red-bright);}
  .bal-cell .lbl{font-size:10.5px;color:var(--text-faint);margin-top:3px;}

  .hist-title{font-size:12.5px;color:var(--text-faint);margin:18px 0 6px;letter-spacing:.03em;}
  .hist-row{
    display:flex;align-items:center;gap:10px;
    padding:10px 2px;border-bottom:1px solid var(--border);
  }
  .hist-row:last-child{border-bottom:none;}
  .hist-left{flex:1;min-width:0;}
  .hist-item{font-size:14px;font-weight:600;}
  .hist-time{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .hist-right{flex-shrink:0;text-align:right;white-space:nowrap;}
  .hist-chg{font-size:14.5px;font-weight:800;}
  .hist-chg.pos{color:var(--green-bright);}
  .hist-chg.neg{color:var(--red-bright);}
  .hist-after{
    display:inline-block;font-size:11.5px;color:var(--text-dim);margin-left:8px;
    padding:1px 7px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);
  }
  .hist-after.neg{color:var(--red-bright);border-color:rgba(192,90,66,.45);}
  .hist-empty{font-size:12.5px;color:var(--text-faint);padding:14px 0;text-align:center;}
  .more-btn{
    width:100%;margin-top:10px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text-dim);border-radius:var(--radius-sm);padding:11px;font-size:13.5px;
    cursor:pointer;font-family:inherit;
  }
  .pick-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;margin-bottom:9px;cursor:pointer;font-family:inherit;
    color:var(--text);text-align:left;transition:border-color .15s,transform .08s;
  }
  .pick-btn:active{transform:scale(.98);border-color:var(--amber-dim);}
  .pick-name{font-size:17px;font-weight:700;}
  .pick-name .title-tag{
    font-size:11.5px;font-weight:500;color:var(--text-faint);margin-left:7px;
    padding:2px 8px;border-radius:20px;background:var(--surface-2);
    border:1px solid var(--border);vertical-align:middle;
  }
  .pick-arrow{color:var(--amber-bright);font-size:17px;flex-shrink:0;}
  .foot{
    margin-top:26px;padding-top:16px;border-top:1px solid var(--border);
    font-size:11.5px;color:var(--text-faint);text-align:center;line-height:1.8;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ 查询 ============ -->
  <div id="lookup-view">
    <div class="brand">
      <div class="mark">66</div>
      <h1>会员查询</h1>
      <p>输入手机号后四位<br>查看你在店里的门票、酒水卡与积分</p>
    </div>
    <div class="card">
      <div class="field">
        <label>手机号后四位</label>
        <input id="in-phone" inputmode="numeric" autocomplete="off"
               placeholder="例如：1234" maxlength="20">
      </div>
      <button class="btn" id="go-btn">查询</button>
      <div class="msg hidden" id="msg"></div>
    </div>
    <div class="foot">本页面只用作会员信息查询<br>如有疑问请联系店员</div>
  </div>

  <!-- ============ 选择本人 ============ -->
  <div id="choose-view" class="hidden">
    <div class="brand" style="margin-bottom:22px;">
      <div class="mark">？</div>
      <h1>请选择你自己</h1>
      <p id="choose-sub"></p>
    </div>
    <div id="choose-list"></div>
    <button class="btn btn-quiet" id="choose-back" style="margin-top:18px;">返回重新输入</button>
    <div class="foot">没有你的名字？请联系店员核对登记信息</div>
  </div>

  <!-- ============ 结果 ============ -->
  <div id="result-view" class="hidden">
    <div class="member-card">
      <div class="member-name" id="r-name"></div>
      <div class="member-phone" id="r-phone"></div>
    </div>
    <div id="r-accounts"></div>
    <button class="btn btn-quiet" id="back-btn" style="margin-top:24px;">返回重新查询</button>
    <div class="foot">数据实时来自门店系统<br>如与实际不符，请联系店员核对</div>
  </div>

</div>

<script>
/* ===== 与员工端同一个 Supabase 项目；此处的 anon key 是公开密钥，
        匿名访客对所有数据表没有任何读写权限，只能调用 customer_portal_lookup 这一个只读函数 ===== */
const SUPABASE_URL = "https://pkuojjqgwpgnjyvfptna.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrdW9qanFnd3Bnbmp5dmZwdG5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MDU5NDcsImV4cCI6MjEwMTE4MTk0N30.O8kWRZ1Uiy0PfG0tMmkpTJV1m458HH6TIvPspTH3GGI";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});

const ITEM_LABELS = {
  tickets:     { name: "SNG门票",  icon: "票" },
  mushroom:    { name: "复活蘑菇", icon: "菇" },
  wine_card:   { name: "酒卡",     icon: "酒" },
  drink_card:  { name: "饮料卡",   icon: "饮" },
  stored_value:{ name: "储值卡",   icon: "储", money: true },
  points:      { name: "积分",     icon: "分" },
};
const ITEM_FIELDS = Object.keys(ITEM_LABELS);
const PAGE = 15;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtVal = (f, v) => (ITEM_LABELS[f] && ITEM_LABELS[f].money ? "¥" : "") + v;

function fmtTime(iso){
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let lastDigits = "";

function showMsg(text, kind){
  const el = $("msg");
  el.className = "msg" + (kind === "info" ? " info" : "");
  el.innerHTML = text;
  el.classList.remove("hidden");
}
function clearMsg(){ $("msg").classList.add("hidden"); }

function toLookup(){
  $("result-view").classList.add("hidden");
  $("choose-view").classList.add("hidden");
  $("lookup-view").classList.remove("hidden");
  clearMsg();
  window.scrollTo(0, 0);
}

$("go-btn").addEventListener("click", ()=> lookup(null));
$("in-phone").addEventListener("keydown", e => { if (e.key === "Enter") lookup(null); });
$("back-btn").addEventListener("click", toLookup);
$("choose-back").addEventListener("click", toLookup);

async function lookup(pick){
  const btn = $("go-btn");

  if (pick === null){
    const phone = $("in-phone").value.replace(/\D/g, "");
    clearMsg();
    if (!(phone.length === 4 || phone.length >= 7)){
      showMsg("请输入手机号的后四位（也可以输入完整手机号）");
      return;
    }
    lastDigits = phone;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>查询中…';
  }

  const args = { p_phone: lastDigits };
  if (pick !== null) args.p_pick = pick;
  const { data, error } = await db.rpc("customer_portal_lookup", args);

  btn.disabled = false;
  btn.textContent = "查询";

  if (error){
    toLookup();
    showMsg("查询失败，请稍后再试");
    console.error(error);
    return;
  }

  switch (data && data.status){
    case "ok":
      render(data);
      return;
    case "choose":
      renderChoose(Array.isArray(data.options) ? data.options : []);
      return;
    case "rate_limited":
      toLookup();
      showMsg("查询过于频繁，请十分钟后再试。");
      return;
    case "not_found":
      toLookup();
      showMsg("没有找到对应的记录。请确认手机号是否与登记时一致，或联系店员。");
      return;
    default:
      toLookup();
      showMsg("查询失败，请稍后再试或联系店员。");
      return;
  }
}

function renderChoose(options){
  $("choose-sub").textContent = `有 ${options.length} 位客人的手机尾号都是 ${esc(lastDigits.slice(-4))}`;
  $("choose-list").innerHTML = options.map(o => `
    <button class="pick-btn" data-pick="${Number(o.pick)}">
      <span class="pick-name">${esc(o.name)}${
        o.title ? `<span class="title-tag">${esc(o.title)}</span>` : ""}</span>
      <span class="pick-arrow">›</span>
    </button>`).join("");

  $("choose-list").querySelectorAll("[data-pick]").forEach(b =>
    b.addEventListener("click", ()=>{
      $("choose-list").querySelectorAll("[data-pick]").forEach(x => x.disabled = true);
      b.querySelector(".pick-arrow").innerHTML = '<span class="spinner dark"></span>';
      lookup(Number(b.dataset.pick));
    }));

  $("lookup-view").classList.add("hidden");
  $("result-view").classList.add("hidden");
  $("choose-view").classList.remove("hidden");
  window.scrollTo(0, 0);
}

function render(data){
  $("r-name").innerHTML = esc(data.name)
    + (data.title ? `<span class="title-tag">${esc(data.title)}</span>` : "");
  $("r-phone").textContent = data.phone_masked || "";

  const accounts = Array.isArray(data.accounts) ? data.accounts : [];
  const multi = accounts.length > 1;

  $("r-accounts").innerHTML = accounts.map((acc, i) => {
    const bal = acc.balances || {};
    const hist = Array.isArray(acc.history) ? acc.history : [];
    return `
      <div class="store-head">
        <h2>${esc(acc.store)}</h2>
        <span>${multi ? "共 " + accounts.length + " 家门店" : "门店"}</span>
      </div>
      <div class="bal-grid">
        ${ITEM_FIELDS.map(f => {
          const v = bal[f] ?? 0;
          const cls = v < 0 ? "neg" : (v === 0 ? "zero" : "");
          return `<div class="bal-cell">
            <div class="disc">${ITEM_LABELS[f].icon}</div>
            <div class="num ${cls}">${esc(fmtVal(f, v))}</div>
            <div class="lbl">${ITEM_LABELS[f].name}</div>
          </div>`;
        }).join("")}
      </div>
      <div class="hist-title">变更记录${hist.length ? "（共 " + hist.length + " 条）" : ""}</div>
      <div id="hist-${i}"></div>`;
  }).join("");

  accounts.forEach((acc, i) => renderHistory(i, Array.isArray(acc.history) ? acc.history : [], PAGE));

  $("lookup-view").classList.add("hidden");
  $("choose-view").classList.add("hidden");
  $("result-view").classList.remove("hidden");
  window.scrollTo(0, 0);
}

function renderHistory(idx, hist, shown){
  const box = $("hist-" + idx);
  if (!box) return;
  if (!hist.length){
    box.innerHTML = `<div class="hist-empty">暂无记录</div>`;
    return;
  }
  const slice = hist.slice(0, shown);
  box.innerHTML = slice.map(h => {
    const f = h.item;
    const label = ITEM_LABELS[f] ? ITEM_LABELS[f].name : esc(f);
    const pos = h.change >= 0;
    const money = ITEM_LABELS[f] && ITEM_LABELS[f].money;
    const verb = money ? (pos ? "充值" : "消费") : (pos ? "增加" : "使用");
    const after = (h.after === null || h.after === undefined) ? "" :
      `<span class="hist-after${h.after < 0 ? " neg" : ""}">余 ${esc(fmtVal(f, h.after))}</span>`;
    return `<div class="hist-row">
      <div class="hist-left">
        <div class="hist-item">${label} ${verb}</div>
        <div class="hist-time">${esc(fmtTime(h.at))}</div>
      </div>
      <div class="hist-right">
        <span class="hist-chg ${pos ? "pos" : "neg"}">${pos ? "+" : "-"}${esc(fmtVal(f, Math.abs(h.change)))}</span>
        ${after}
      </div>
    </div>`;
  }).join("");

  if (hist.length > shown){
    const btn = document.createElement("button");
    btn.className = "more-btn";
    btn.textContent = `显示更早的记录（还有 ${hist.length - shown} 条）`;
    btn.addEventListener("click", ()=> renderHistory(idx, hist, shown + PAGE));
    box.appendChild(btn);
  }
}
</script>
</body>
</html>
